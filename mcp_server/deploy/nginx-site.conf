server {
    listen 80;
    listen [::]:80;
    server_name mcp.german-elections.com;
    access_log /var/log/nginx/gerda-mcp-access.log;
    error_log /var/log/nginx/gerda-mcp-error.log;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.german-elections.com;
    access_log /var/log/nginx/gerda-mcp-access.log;
    error_log /var/log/nginx/gerda-mcp-error.log;

    ssl_certificate /etc/letsencrypt/live/mcp.german-elections.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.german-elections.com/privkey.pem;

    client_max_body_size 1m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /mcp {
        limit_req zone=gerda_mcp_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
